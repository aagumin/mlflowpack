apiVersion: kpack.io/v1alpha2
kind: ClusterBuilder
metadata:
  name: mlflow-builder
spec:
  serviceAccount: default
  tag: localhost:5000/mlflow-builder
  stack:
    name: mlflow-stack
    kind: ClusterStack
  store:
    name: mlflow-store
    kind: ClusterStore
  order:
  - group:
    - id: io.amazme.buildpacks.mlflow-model
      version: "0.1.0"
