version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - wastedassign
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G117
        - G204
        - G301
        - G302
        - G304
        - G306
        - G307
    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
